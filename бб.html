<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>P2P Радар</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #0a1020; --bg2: #101a33; --card: rgba(255,255,255,.05); --line: rgba(255,255,255,.09);
  --text: #e8eefc; --hint: #8ea0c6; --accent: #2f9bff; --onaccent: #ffffff;
  --good: #22c55e; --bad: #ef4444;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  font-family: -apple-system, system-ui, "SF Pro Text", Roboto, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  background-image: radial-gradient(900px 420px at 50% -140px, var(--bg2), transparent);
  background-repeat: no-repeat;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
#view { padding: 18px 16px 190px; max-width: 560px; margin: 0 auto; }
h1 { font-size: 26px; margin: 0; letter-spacing: -.4px; }
h2 { font-size: 20px; margin: 26px 0 10px; letter-spacing: -.2px; }
.top p { margin: 4px 0 18px; color: var(--hint); font-size: 14px; }
label.cap { display: block; font-size: 13px; color: var(--hint); margin: 16px 0 7px; }

.seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 12px 6px; border-radius: 10px; font-weight: 600; font-size: 15px; }
.seg button.on { background: var(--accent); color: var(--onaccent); box-shadow: 0 4px 14px rgba(47,155,255,.35); }

.row2 { display: flex; gap: 10px; }
.row2 > div { flex: 1; min-width: 0; }
select, .in {
  width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); font-size: 16px; appearance: none; -webkit-appearance: none;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--hint) 50%), linear-gradient(135deg, var(--hint) 50%, transparent 50%);
  background-position: calc(100% - 20px) 55%, calc(100% - 15px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
select option { color: #111; }
.in::placeholder { color: var(--hint); opacity: .7; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 9px 15px; font-size: 14px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--onaccent); font-weight: 600; }
.tag { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 12px; font-size: 14px; }
.tag button { border: 0; background: rgba(128,128,128,.25); width: 22px; height: 22px; border-radius: 50%; line-height: 20px; padding: 0; font-size: 15px; }
.tag.no { border-color: rgba(239,68,68,.5); }

.ghost { width: 100%; margin-top: 14px; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
.badge { background: var(--accent); color: var(--onaccent); border-radius: 999px; font-size: 12px; padding: 1px 8px; }
.panel { margin-top: 10px; padding: 4px 14px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
.check { display: flex; align-items: center; gap: 10px; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); font-size: 15px; margin: 0; }
.check input { width: 20px; height: 20px; margin: 0; }
.add { display: flex; gap: 8px; }
.add button { flex: none; width: 48px; border: 0; border-radius: 12px; background: var(--accent); color: var(--onaccent); font-size: 22px; }
.gap { margin-top: 10px; }

#cta { position: fixed; left: 50%; transform: translateX(-50%); width: calc(100% - 32px); max-width: 528px;
  bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 5; }
.primary { width: 100%; padding: 16px; border: 0; border-radius: 14px; background: var(--accent); color: var(--onaccent);
  font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 10px 28px rgba(0,0,0,.4); }
.primary:disabled { opacity: .6; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 14px; font-weight: 600; font-size: 14px; }
.btn.acc { background: var(--accent); border-color: var(--accent); color: var(--onaccent); }
.btn.danger { color: var(--bad); }

#nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom));
  width: calc(100% - 24px); max-width: 536px; display: flex; gap: 4px; padding: 6px; z-index: 6;
  background: var(--bg2); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
#nav button { flex: 1; border: 0; background: transparent; border-radius: 16px; padding: 8px 2px 7px; color: var(--hint);
  display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; }
#nav button.on { background: rgba(47,155,255,.16); color: var(--accent); font-weight: 600; }
svg.ic { width: 22px; height: 22px; }

.sum { display: flex; gap: 8px; margin: 18px 0 6px; }
.sum div { flex: 1; padding: 11px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
.sum small { display: block; color: var(--hint); font-size: 12px; }
.sum b { font-size: 16px; }
.note { color: var(--hint); font-size: 13px; margin: 6px 2px 10px; line-height: 1.4; }

.ad { margin-top: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); }
.ad-top { display: flex; align-items: center; gap: 10px; }
.av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex: none; overflow: hidden; }
.av img { width: 100%; height: 100%; object-fit: cover; }
.nm { flex: 1; min-width: 0; }
.nm b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nm small { color: var(--hint); font-size: 13px; }
.star { border: 0; background: transparent; padding: 6px; color: var(--hint); }
.star.on { color: #f5b301; }
.price { margin: 12px 0 2px; font-size: 32px; font-weight: 700; letter-spacing: -.8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.price span { font-size: 15px; color: var(--hint); font-weight: 500; letter-spacing: 0; }
.dev { font-size: 13px; font-weight: 600; letter-spacing: 0; padding: 2px 8px; border-radius: 999px; }
.dev.good { background: rgba(34,197,94,.16); color: var(--good); }
.dev.bad { background: rgba(239,68,68,.16); color: var(--bad); }
.dev.mid { background: rgba(128,128,128,.18); color: var(--hint); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin-top: 10px; font-size: 14px; }
.facts small { display: block; color: var(--hint); font-size: 12px; }
.facts .wide { grid-column: 1 / -1; }
.remark { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.4; color: var(--hint); word-break: break-word; }
mark { background: rgba(245,179,1,.28); color: inherit; border-radius: 4px; padding: 0 2px; }
.acts { display: flex; gap: 8px; margin-top: 12px; }
.acts .btn { flex: 1; }

.sk { height: 190px; margin-top: 12px; border-radius: 18px; background: linear-gradient(90deg, var(--card), rgba(128,128,128,.16), var(--card)); background-size: 200% 100%; animation: sh 1.2s linear infinite; }
@keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } }

.empty { text-align: center; padding: 38px 18px; color: var(--hint); border: 1px dashed var(--line); border-radius: 18px; margin-top: 16px; line-height: 1.5; }
.empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }
.err { margin-top: 16px; padding: 16px; border-radius: 16px; border: 1px solid rgba(239,68,68,.45); background: rgba(239,68,68,.08); line-height: 1.45; font-size: 14px; }
.err b { display: block; font-size: 16px; margin-bottom: 6px; }
.err .btn { margin-top: 10px; margin-right: 8px; }

.hero { text-align: center; padding-top: 6px; }
.ava { width: 96px; height: 96px; margin: 8px auto 12px; border-radius: 50%; padding: 4px; border: 3px solid var(--accent); display: grid; place-items: center; }
.ava .av { width: 100%; height: 100%; font-size: 34px; }
.hero h1 { font-size: 24px; }
.hero p { margin: 4px 0 12px; color: var(--hint); font-size: 14px; }
.pill { display: inline-block; padding: 8px 16px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; font-weight: 600; font-size: 14px; }
.stats { display: flex; gap: 10px; margin-top: 20px; }
.stats div { flex: 1; text-align: left; padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); }
.stats small { color: var(--hint); font-size: 13px; }
.stats b { display: block; font-size: 26px; margin-top: 4px; }
.list { border: 1px solid var(--line); border-radius: 18px; background: var(--card); overflow: hidden; }
.item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 14px; border: 0; background: transparent; text-align: left; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .ico { width: 42px; height: 42px; border-radius: 12px; background: rgba(128,128,128,.14); display: grid; place-items: center; flex: none; }
.item .rt { flex: 1; min-width: 0; }
.item .rt b { display: block; font-size: 16px; }
.item .rt small { color: var(--hint); font-size: 13px; }
.item .chev { color: var(--hint); font-size: 20px; }
.footnote { text-align: center; color: var(--hint); font-size: 13px; margin: 18px 0 0; }

.hrow { display: flex; align-items: center; gap: 10px; padding: 13px 14px; border-top: 1px solid var(--line); }
.hrow:first-child { border-top: 0; }
.hrow .t { flex: 1; min-width: 0; font-size: 14px; line-height: 1.35; }
.hrow .t small { color: var(--hint); display: block; font-size: 12px; }

#sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55); display: none; align-items: flex-end; }
#sheet.show { display: flex; }
.sheet-card { width: 100%; max-width: 560px; margin: 0 auto; max-height: 86vh; overflow-y: auto; background: var(--bg2); color: var(--text);
  border-radius: 24px 24px 0 0; padding: 18px 16px calc(24px + env(safe-area-inset-bottom)); border: 1px solid var(--line); }
.sheet-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.sheet-h b { font-size: 19px; }
.sheet-b { font-size: 14px; line-height: 1.5; }
.sheet-b p { margin: 8px 0; }
.sheet-b ul { padding-left: 18px; margin: 8px 0; }
.sheet-b li { margin: 4px 0; }

#toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(10px);
  background: #111; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: .2s; z-index: 30; }
#toast.show { opacity: 1; transform: translateX(-50%); }
.dev.warn { background: rgba(245,158,11,.18); color: #f59e0b; }
.orig { color: var(--hint); font-size: 13px; margin-top: -2px; }
.banner { margin: 12px 0 0; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(245,158,11,.45); background: rgba(245,158,11,.08); font-size: 13px; line-height: 1.45; }
.res-line { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
.res-line:first-child { border-top: 0; }
.pos { color: var(--good); }
.neg { color: var(--bad); }
.sub-h { font-size: 17px; margin: 22px 0 0; }
textarea.in { resize: vertical; min-height: 84px; line-height: 1.4; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div id="view"></div>
<div id="cta"></div>
<nav id="nav"></nav>
<div id="sheet"></div>
<div id="toast"></div>

<script>
(function () {
"use strict";

var tg = window.Telegram && window.Telegram.WebApp;

// Адрес прокси можно вписать сюда или ввести в приложении: Профиль → Подключение
var CONFIG = { PROXY: "", SUPABASE_URL: "https://pbdsxtidzgnfeoklwnjg.supabase.co", SUPABASE_KEY: "sb_publishable_TvenpPa82DBJISTZ5BG7kA_HNDjolf2" };
var DIRECT = "https://api2.bybit.com/fiat/otc/item/online";
var BYBIT_PAGE = "https://www.bybit.com/fiat/trade/otc/";
var BOT = "OrdersPayX_Bot";

var TOKENS = ["USDT", "USDC", "BTC", "ETH"];
var FIATS = ["USD", "EUR", "KZT", "TRY", "AED", "UAH", "RUB"];
var SORTS = [
  ["best", "Выгодные"], ["low", "Низкий курс"], ["high", "Высокий курс"],
  ["rate", "Рейтинг"], ["orders", "Сделки"], ["limit", "Большой лимит"]
];
var PAY = { "14": "Bank Transfer" };
var THIRD = ["3 лиц", "3х лиц", "3-х лиц", "3-их лиц", "3 лица", "третьих лиц", "третьи лица", "доверенн", "довоенн", "3rd party", "third party"];
var NEG = ["без", "не ", "нет", "запрещ", "no ", "not "];

var DEFAULT_F = { side: "buy", token: "USDT", fiat: "USD", sort: "best", amount: "", minRate: 95, minOrders: 50, third: false, words: [], stop: [] };

function load(k, d) { try { var v = localStorage.getItem("p2p_" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem("p2p_" + k, JSON.stringify(v)); } catch (e) {} }

var prefs = load("prefs", { theme: "tg", searches: 0, proxy: "" });
var favs = load("favs", []);
var hist = load("hist", []);
var presets = load("presets", []);
var f = Object.assign({}, DEFAULT_F, load("filters", {}));
var ui = { tab: "search", reqFilter: "open", reqAmount: "", reqRate: "", chatText: "", open: false, raw: null, meta: null, loading: false, error: null,
  regTab: "buy", regIdx: 0, regForm: {}, regCalc: "", sp: { loading: false, error: null, data: null }, calc: Object.assign({ amount: "10000", buy: "", sell: "", feeBuy: "0", feeSell: "0" }, load("calc", {})) };
var user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
var market = { client: null, ready: false, busy: false, active: null, messages: [], poll: null, work: load("market_work", false) };
var marketUser = { id: null, label: "Пользователь" };
function marketConfigured() { return !!(window.supabase && CONFIG.SUPABASE_URL.indexOf("https://") === 0 && CONFIG.SUPABASE_KEY.indexOf("ВСТАВЬТЕ") !== 0); }
async function marketInit() {
  if (market.ready) return true;
  if (!marketConfigured()) return false;
  market.client = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
  var au = await market.client.auth.getSession();
  if (!au.data.session) { var sign = await market.client.auth.signInAnonymously(); if (sign.error) throw sign.error; }
  var sess = await market.client.auth.getSession(); marketUser.id = sess.data.session.user.id;
  marketUser.label = user ? ((user.first_name || "") + (user.username ? " · @" + user.username : "")).trim() : "Пользователь";
  // Сохраняем режим «В работе» в общей базе, а не только в localStorage.
  var profile = await market.client.from("p2p_profiles").select("work_enabled").eq("user_id", marketUser.id).maybeSingle();
  if (profile.error) throw profile.error;
  if (profile.data) market.work = !!profile.data.work_enabled;
  else {
    var created = await market.client.from("p2p_profiles").insert({user_id:marketUser.id, display_name:marketUser.label, work_enabled:!!market.work});
    if (created.error) throw created.error;
  }
  save("market_work", market.work);
  market.ready = true;
  return true;
}
function marketUnavailable() { sheet("Подключение заявок", '<p>Для обмена заявками между разными пользователями нужен общий сервер. Подключите Supabase и выполните SQL из файла <b>supabase_setup.sql</b>, затем укажите URL и anon key в CONFIG в начале HTML.</p><p>Без этого заявки будут недоступны другим пользователям — одно HTML-хранилище не может рассылать их между телефонами.</p>'); }
function marketStatus(r) { return r.status === "open" ? "Открыта" : r.status === "active" ? "В работе" : "Завершена"; }
function marketTabs() { return '<div class="seg">' + seg("reqfilter", "open", "Новые", ui.reqFilter || "open") + seg("reqfilter", "active", "В работе", ui.reqFilter || "open") + seg("reqfilter", "done", "Завершённые", ui.reqFilter || "open") + '</div>'; }
async function loadRequests() {
  if (!await marketInit()) { render(); return; }
  var q = market.client.from("p2p_requests").select("*").order("created_at", {ascending:false}).limit(100);
  var res = await q; if (res.error) { toast("Не удалось загрузить заявки"); return; }
  market.requests = res.data || []; render();
}
function requestCard(r) {
  var mine = r.owner_id === marketUser.id, taken = r.taker_id === marketUser.id;
  var h = '<div class="ad"><div class="ad-top"><div class="nm"><b>Заявка #' + esc(String(r.id).slice(0,8)) + '</b><small>' + esc(r.owner_label || "Мерчант") + ' · ' + new Date(r.created_at).toLocaleString("ru-RU") + '</small></div><span class="dev ' + (r.status === "done" ? "good" : r.status === "active" ? "warn" : "mid") + '">' + marketStatus(r) + '</span></div>';
  h += '<div class="price">' + fmt(Number(r.amount),2) + ' ₽ <span>сумма</span></div><div class="facts"><div><small>Курс</small>' + fmt(Number(r.rate),2) + ' ₽</div><div><small>Создатель</small>' + (mine ? 'Вы' : esc(r.owner_label || 'Мерчант')) + '</div></div>';
  
  if (r.status === "open" && !mine && market.work) h += '<button class="btn acc" data-act="claimReq" data-id="' + esc(r.id) + '" style="width:100%;margin-top:12px">Взять ордер</button>';
  if (r.status === "active" && (mine || taken)) h += '<div class="acts"><button class="btn" data-act="chatReq" data-id="' + esc(r.id) + '">Открыть чат</button><button class="btn acc" data-act="doneReq" data-id="' + esc(r.id) + '">Завершить</button></div>';
  if (r.status === "done") h += '<p class="note">Участники: ' + (mine ? 'Вы' : esc(r.owner_label || 'Мерчант')) + ' и ' + (taken ? 'Вы' : esc(r.taker_label || 'Исполнитель')) + '</p>';
  h += '</div>'; return h;
}
function requestsTab() {
  var filter = ui.reqFilter || "open", all = market.requests || [];
  var list = all.filter(function(r){ return filter === "open" ? (market.work && r.status === "open") : filter === "active" ? r.status === "active" && (r.owner_id === marketUser.id || r.taker_id === marketUser.id) : r.status === "done" && (r.owner_id === marketUser.id || r.taker_id === marketUser.id); });
  var h = '<header class="top"><h1>Заявки</h1><p>Публикуйте тестовые предложения и просматривайте заявки участников.</p></header>';
  h += '<div class="panel" style="padding:14px"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div><b>Принимать заявки</b><div class="note" style="margin:4px 0 0">' + (market.work ? 'Вы в линии — новые заявки доступны вам' : 'Вы не получаете новые заявки') + '</div></div><button class="btn ' + (market.work ? 'acc' : '') + '" data-act="toggleWork">' + (market.work ? '● В работе' : '○ Выключено') + '</button></div></div>';
  h += '<button class="primary" data-act="newRequest" style="margin-top:14px">＋ Создать заявку</button>';
  h += '<h2>Лента заявок</h2>' + marketTabs();
  if (!market.ready) h += '<div class="empty"><b>Нужно подключить сервер</b>Настройте Supabase, чтобы заявки и чаты синхронизировались у всех пользователей.</div>';
  else if (!list.length) h += '<div class="empty"><b>Заявок пока нет</b>' + (filter === "open" && !market.work ? "Включите режим «В работе», чтобы получать новые заявки." : "Здесь появятся предложения, подходящие выбранному разделу.") + '</div>';
  else h += list.map(requestCard).join("");
  return h;
}
function newRequestSheet() {
  sheet("Новая заявка", '<p class="note">Демо-режим: используйте только вымышленные суммы и значения. Заявка станет видна участникам, у которых включён режим «В работе».</p><label class="cap">Сумма, ₽</label><input class="in" data-f="reqAmount" inputmode="decimal" placeholder="Например, 5000"><label class="cap">Курс за 1 USDT, ₽</label><input class="in" data-f="reqRate" inputmode="decimal" placeholder="Например, 98"><div class="acts"><button class="btn acc" data-act="publishReq">Опубликовать</button><button class="btn" data-act="sheetClose">Отмена</button></div>');
}
async function publishRequest() {
  var amount = num(ui.reqAmount), rate = num(ui.reqRate);
  if (!amount || amount <= 0 || !rate || rate <= 0) { toast("Укажите корректные сумму и курс"); return; }
  try { if (!await marketInit()) return marketUnavailable();
    var x = await market.client.from("p2p_requests").insert({owner_id:marketUser.id, owner_label:marketUser.label, amount:amount, rate:rate, status:"open"}).select().single();
    if (x.error) throw x.error; closeSheet(); ui.reqFilter="open"; await loadRequests(); toast("Заявка опубликована");

/* ---------- курсы валют к рублю (ЦБ РФ) ---------- */
var rates = load("rates", { rub: {}, at: 0 });
var ratesP = null;
function rubRate(cur) {
  if (cur === "RUB") return 1;
  var base = (rates.rub && rates.rub[cur]) || null;
  var my = num(prefs.myRate), usd = rates.rub && rates.rub.USD;
  if (my) {
    if (cur === "USD") return my;
    if (base && usd) return base * my / usd;
  }
  return base;
}
function rubOn(fiat, force) { return !!(force || prefs.rub !== false) && fiat !== "RUB" && !!rubRate(fiat); }
function disp(price, fiat, force) { return price === null || price === undefined ? null : (rubOn(fiat, force) ? price * rubRate(fiat) : price); }
function dispCur(fiat, force) { return rubOn(fiat, force) ? "₽" : fiat; }
function mul(v, k) { return v === null || v === undefined ? null : v * k; }
function loadRates() {
  if (ratesP) return ratesP;
  ratesP = (async function () {
    if (rates.at && Date.now() - rates.at < 6 * 3600 * 1000 && rates.rub && rates.rub.USD) return false;
    var out = null, list = ["USD", "EUR", "KZT", "TRY", "AED", "UAH"];
    try {
      var r = await fetch("https://www.cbr-xml-daily.ru/daily_json.js");
      var d = await r.json(), o = {};
      list.forEach(function (c) { if (d.Valute && d.Valute[c]) o[c] = d.Valute[c].Value / d.Valute[c].Nominal; });
      if (o.USD) out = o;
    } catch (e) {}
    if (!out) {
      try {
        var r2 = await fetch("https://open.er-api.com/v6/latest/USD");
        var d2 = await r2.json(), o2 = {};
        list.forEach(function (c) { if (d2.rates && d2.rates[c] && d2.rates.RUB) o2[c] = d2.rates.RUB / d2.rates[c]; });
        if (o2.USD) out = o2;
      } catch (e) {}
    }
    if (out) { rates = { rub: out, at: Date.now() }; save("rates", rates); return true; }
    ratesP = null;
    return false;
  })();
  return ratesP;
}

/* ---------- данные ---------- */
function payload(side, token, fiat, page) {
  return {
    userId: "", tokenId: token, currencyId: fiat, payment: [], side: side === "buy" ? "1" : "0",
    size: "50", page: String(page), amount: "", vaMaker: false, bulkMaker: false, canTrade: false,
    verificationFilter: 0, sortType: "TRADE_PRICE", paymentPeriod: [], itemRegion: 1

async function fetchPage(url, side, token, fiat, page) {
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 15000);
  try {
    var r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload(side, token, fiat, page)), signal: ctrl.signal });
    var d = await r.json();
    if (d && d.ret_code && d.ret_code !== 0) throw new Error(d.ret_msg || "ошибка Bybit");
    return (d && d.result && d.result.items) || [];
  } finally { clearTimeout(timer); }
}
async function fetchAds(side, token, fiat) {
  var url = (prefs.proxy || CONFIG.PROXY || "").trim();
  var viaProxy = !!url;
  if (!viaProxy) url = DIRECT;
  var pages = await Promise.all([
    fetchPage(url, side, token, fiat, 1),
    fetchPage(url, side, token, fiat, 2).catch(function () { return []; })
  ]);
  var seen = {}, items = [];
  pages[0].concat(pages[1]).forEach(function (a) {
    var k = String(a.id);
    if (!seen[k]) { seen[k] = 1; items.push(a); }
  });
  return { items: items, source: viaProxy ? "прокси" : "напрямую" };
}
function explain(e) {
  var m = String((e && e.message) || e || "");

  if (/Failed to fetch|Load failed|NetworkError|CORS/i.test(m)) return "Браузер не даёт обратиться к Bybit напрямую (ограничение CORS).";

/* ---------- фильтры ---------- */
function allowsThird(text) {
  for (var i = 0; i < THIRD.length; i++) {
    var at = text.indexOf(THIRD[i]);
    while (at !== -1) {
      var before = text.slice(Math.max(0, at - 25), at);
      var neg = NEG.some(function (n) { return before.indexOf(n) !== -1; });
      if (!neg) return true;
      at = text.indexOf(THIRD[i], at + 1);
    }
  }
  return false;
}
function applyFilters(items, side, meta) {
  var amount = num(f.amount);
  if (amount && meta && meta.fallback && rubRate(meta.fiat)) amount = amount / rubRate(meta.fiat);
  var out = items.filter(function (ad) {
    var price = num(ad.price);
    if (price === null || price <= 0) return false;
    var rate = num(ad.recentExecuteRate), orders = num(ad.recentOrderNum);
    if (rate !== null && rate < f.minRate) return false;
    if (orders !== null && orders < f.minOrders) return false;
    if (amount) {
      var lo = num(ad.minAmount), hi = num(ad.maxAmount);
      if (lo !== null && amount < lo) return false;
      if (hi !== null && amount > hi) return false;
    }
    var text = decode(ad.remark).toLowerCase();
    if (f.third && !allowsThird(text)) return false;
    for (var i = 0; i < f.words.length; i++) if (text.indexOf(f.words[i]) === -1) return false;
    for (var j = 0; j < f.stop.length; j++) if (text.indexOf(f.stop[j]) !== -1) return false;
    return true;
  });
  var mode = f.sort;
  if (mode === "best") mode = side === "buy" ? "low" : "high";
  out.sort(function (a, b) {
    var d;
    if (mode === "low") d = num(a.price) - num(b.price);
    else if (mode === "high") d = num(b.price) - num(a.price);
    else if (mode === "rate") d = (num(b.recentExecuteRate) || 0) - (num(a.recentExecuteRate) || 0);
    else if (mode === "orders") d = (num(b.recentOrderNum) || 0) - (num(a.recentOrderNum) || 0);
    else d = (num(b.maxAmount) || 0) - (num(a.maxAmount) || 0);
    if (d === 0) d = (num(b.recentOrderNum) || 0) - (num(a.recentOrderNum) || 0);
    return d;
  });
  return out;
}
function filterCount() {
  var n = 0;
  if (f.amount) n++;
  if (f.minRate !== DEFAULT_F.minRate) n++;
  if (f.minOrders !== DEFAULT_F.minOrders) n++;
  if (f.third) n++;
  n += f.words.length + f.stop.length;
  return n;
}

  var rec = { handle: handle, from: from, to: to, note: String(F.note || "").trim() };
  if (F.idx === null) regs[F.kind].push(rec); else regs[F.kind][F.idx] = rec;
  saveRegs(); closeSheet(); render(); toast("Сохранено");
}
function navHtml() {

}
function ctaHtml() {

function render() {

/* ---------- окна ---------- */

function closeSheet() { $("sheet").className = ""; $("sheet").innerHTML = ""; }

function connSheet() {
  var cur = esc(prefs.proxy || CONFIG.PROXY || "");

function presetsSheet() {
  if (!presets.length) { sheet("Сохранённые наборы", '<p>Пока нет наборов. Настройте фильтры на вкладке «Поиск» и нажмите «Сохранить набор».</p>'); return; }
  var h = '<div class="list">' + presets.map(function (q, i) {
    return '<div class="hrow"><div class="t">' + esc(describe(q)) + '</div><button class="btn acc" data-act="applyPreset" data-i="' + i + '">Взять</button><button class="btn danger" data-act="delPreset" data-i="' + i + '">×</button></div>';

/* ---------- действия ---------- */
function addWord(kind) {
  var el = document.querySelector('[data-f="in-' + kind + '"]');
  if (!el) return;
  el.value.split(",").forEach(function (w) {
    w = w.trim().toLowerCase();
    if (w && f[kind].indexOf(w) === -1) f[kind].push(w);
  });
  el.value = "";
  save("filters", f); render();
  var again = document.querySelector('[data-f="in-' + kind + '"]');
  if (again && again.focus) again.focus();
}
function pushHist(found) {
  hist.unshift({ side: f.side, token: f.token, fiat: f.fiat, sort: f.sort, amount: f.amount, third: f.third,
    words: f.words.slice(), stop: f.stop.slice(), minRate: f.minRate, minOrders: f.minOrders, found: found, at: Date.now() });
  hist = hist.slice(0, 30); save("hist", hist);
}
async function doSearch() {
  ui.loading = false;
  ui.raw = [];
  ui.meta = {side:f.side, token:f.token, fiat:f.fiat, requested:f.fiat, fallback:false, mid:null, min:null, max:null, total:0, source:"demo", at:Date.now()};
  ui.error = "Поиск реальных объявлений отключён. Это демонстрационная версия интерфейса.";
  render();
}
async function doSpread() {
  if (ui.sp.loading) return;
  ui.sp = { loading: true, error: null, data: null }; render();
  try {
    await loadRates();
    var used = f.fiat, fallback = false;
    var pair = await Promise.all([fetchAds("buy", f.token, used), fetchAds("sell", f.token, used)]);
    if (!pair[0].items.length && !pair[1].items.length && used === "RUB") {
      used = "USD"; fallback = true;
      pair = await Promise.all([fetchAds("buy", f.token, used), fetchAds("sell", f.token, used)]);
    }
    var meta = { token: f.token, fiat: used, requested: f.fiat, fallback: fallback, at: Date.now(), source: pair[0].source };
    var buyList = applyFilters(pair[0].items, "buy", meta);
    var sellList = applyFilters(pair[1].items, "sell", meta);
    var ask = best(buyList, "min"), bid = best(sellList, "max");
    if (ask) { ask._side = "buy"; ask._token = f.token; ask._fiat = used; }
    if (bid) { bid._side = "sell"; bid._token = f.token; bid._fiat = used; }
    ui.sp = { loading: false, error: null, data: { meta: meta, ask: ask, bid: bid, nBuy: buyList.length, nSell: sellList.length } };
  } catch (e) {
    ui.sp = { loading: false, error: explain(e), data: null };
  }
  render();
}
function findAd(id) {
  var all = (ui.raw || []).concat(favs);
  if (ui.sp && ui.sp.data) all = all.concat([ui.sp.data.ask, ui.sp.data.bid]);
  for (var i = 0; i < all.length; i++) if (all[i] && String(all[i].id) === String(id)) return all[i];
  return null;
}
function toggleFav(id) {
  if (isFav(id)) { favs = favs.filter(function (a) { return String(a.id) !== String(id); }); toast("Убрано из избранного"); }
  else {
    var ad = findAd(id);
    if (!ad) return;
    var m = ui.meta || {};
    favs.unshift({ id: ad.id, accountId: ad.accountId, userId: ad.userId, nickName: ad.nickName, price: ad.price, recentExecuteRate: ad.recentExecuteRate, recentOrderNum: ad.recentOrderNum,
      minAmount: ad.minAmount, maxAmount: ad.maxAmount, lastQuantity: ad.lastQuantity, remark: ad.remark, payments: ad.payments,
      side: ad._side || m.side || f.side, token: ad._token || m.token || f.token, fiat: ad._fiat || m.fiat || f.fiat, savedAt: Date.now() });
    favs = favs.slice(0, 50); toast("Добавлено в избранное");
  }
  save("favs", favs); render();
}
function useQuery(q) {
  f = Object.assign({}, DEFAULT_F, { side: q.side, token: q.token, fiat: q.fiat, sort: q.sort, amount: q.amount || "",
    minRate: q.minRate == null ? 95 : q.minRate, minOrders: q.minOrders == null ? 50 : q.minOrders, third: !!q.third,
    words: (q.words || []).slice(), stop: (q.stop || []).slice() });
  ui.raw = null; ui.meta = null; ui.error = null; save("filters", f);
}
async function testConn() {
  toast("Проверяю…");
  try {
    var res = await fetchAds("buy", "USDT", "USD");
    toast("Связь есть: " + res.items.length + " объявл. (" + res.source + ")");
  } catch (e) { toast("Нет связи: " + explain(e).slice(0, 60)); }
}

document.addEventListener("click", function (e) {
  var el = e.target.closest ? e.target.closest("[data-act]") : null;
  if (!el) return;
  var act = el.getAttribute("data-act"), v = el.getAttribute("data-v"), i = parseInt(el.getAttribute("data-i"), 10);
  var id = el.getAttribute("data-id");
  haptic();
  if (act === "tab") { ui.tab = v; closeSheet(); render(); window.scrollTo(0, 0); }
  else if (act === "side") { f.side = v; ui.raw = null; ui.error = null; save("filters", f); render(); }
  else if (act === "sort") { f.sort = v; save("filters", f); render(); }
  else if (act === "search") doSearch();
  else if (act === "reqfilter") { ui.reqFilter=v; render(); }
  else if (act === "toggleWork") setWorkMode(!market.work);
  else if (act === "newRequest") { ui.reqAmount=""; ui.reqRate=""; newRequestSheet(); }
  else if (act === "publishReq") publishRequest();
  else if (act === "claimReq") claimRequest(id);
  else if (act === "chatReq") openRequestChat(id);
  else if (act === "sendMsg") sendMessage();
  else if (act === "doneReq") finishRequest(id);
  else if (act === "spread") doSpread();
  else if (act === "gospread") { ui.tab = "spread"; render(); window.scrollTo(0, 0); doSpread(); }
  else if (act === "openurl") openUrl(el.getAttribute("data-url"));
  else if (act === "rubmode") { prefs.rub = (v === "on"); save("prefs", prefs); render(); }
  else if (act === "regtab") { ui.regTab = v; render(); }
  else if (act === "regopen") regSheet(i);
  else if (act === "regadd") sheet("Добавление постоянника", '<p>Добавление постоянного клиента доступно через администратора. Напишите запрос — администратор проверит данные и добавит контакт в список.</p><div class="panel"><b>Администратор</b><p style="margin:6px 0 0;color:var(--accent)">@bakinskiiy77</p></div><button class="btn acc" data-act="contactAdmin" style="width:100%;margin-top:12px">Написать администратору</button>');
  else if (act === "contactAdmin") openTg("bakinskiiy77");
  else if (act === "regedit") regFormSheet(ui.regTab, i);
  else if (act === "regsave") regSave();
  else if (act === "regdel") { regs[ui.regTab].splice(i, 1); saveRegs(); closeSheet(); render(); toast("Удалено"); }
  else if (act === "opentg") openTg(el.getAttribute("data-h"));
  else if (act === "copyh") { copyText("@" + el.getAttribute("data-h")); toast("Ник скопирован"); }
  else if (act === "toggleFilters") { ui.open = !ui.open; render(); }
  else if (act === "addWord") addWord(v);
  else if (act === "delWord") { f[v].splice(i, 1); save("filters", f); render(); }
  else if (act === "reset") { f.amount = ""; f.minRate = 95; f.minOrders = 50; f.third = false; f.words = []; f.stop = []; save("filters", f); render(); }
  else if (act === "savePreset") { presets.unshift({ side: f.side, token: f.token, fiat: f.fiat, sort: f.sort, amount: f.amount, minRate: f.minRate,
    minOrders: f.minOrders, third: f.third, words: f.words.slice(), stop: f.stop.slice() }); presets = presets.slice(0, 12); save("presets", presets); toast("Набор сохранён в профиле"); }
  else if (act === "fav") toggleFav(id);
  else if (act === "copy") { copyText(String(id)); toast("ID скопирован"); }
  else if (act === "open") openUrl(BYBIT_PAGE + "?actionType=" + (el.getAttribute("data-side") === "buy" ? "1" : "0") + "&token=" + el.getAttribute("data-token") + "&fiat=" + el.getAttribute("data-fiat"));
  else if (act === "tobot") {
    if (tg && tg.initData) { try { tg.sendData(JSON.stringify({ side: f.side, token: f.token, fiat: f.fiat, third: f.third })); } catch (x) { toast("Не удалось отправить"); } }
    else toast("Откройте приложение кнопкой из чата с ботом");
  }
  else if (act === "theme") { prefs.theme = v; save("prefs", prefs); applyTheme(); render(); }
  else if (act === "presets") presetsSheet();
  else if (act === "applyPreset") { useQuery(presets[i]); closeSheet(); ui.tab = "search"; render(); window.scrollTo(0, 0); toast("Набор применён, нажмите «Поиск»"); }
  else if (act === "delPreset") { presets.splice(i, 1); save("presets", presets); presetsSheet(); }
  else if (act === "repeat") { useQuery(hist[i]); ui.tab = "search"; render(); window.scrollTo(0, 0); doSearch(); }
  else if (act === "clearHist") { hist = []; save("hist", hist); render(); }
  else if (act === "goFavs") { ui.tab = "favs"; render(); window.scrollTo(0, 0); }
  else if (act === "goHist") { ui.tab = "hist"; render(); window.scrollTo(0, 0); }
  else if (act === "clearAll") { favs = []; hist = []; presets = []; save("favs", favs); save("hist", hist); save("presets", presets); toast("Данные очищены"); render(); }
  else if (act === "help") helpSheet();
  else if (act === "contactAdmin") openTg("bakinskiiy77");
  else if (act === "conn") connSheet();
  else if (act === "clearProxy") { prefs.proxy = ""; save("prefs", prefs); connSheet(); render(); }
  else if (act === "testConn") testConn();
  else if (act === "bybit") openUrl(BYBIT_PAGE);
  else if (act === "bot") { var u = "https://t.me/" + BOT; if (tg && tg.openTelegramLink) tg.openTelegramLink(u); else openUrl(u); }
  else if (act === "sheetClose") closeSheet();
});
$("sheet").addEventListener("click", function (e) { if (e.target === $("sheet")) closeSheet(); });

document.addEventListener("input", function (e) {
  var t = e.target, k = t.getAttribute && t.getAttribute("data-f");
  if (!k) return;
  if (k === "amount") { f.amount = t.value.replace(",", ".").replace(/[^0-9.]/g, ""); save("filters", f); }
  else if (k === "minRate") { f.minRate = num(t.value) || 0; save("filters", f); }
  else if (k === "minOrders") { f.minOrders = num(t.value) || 0; save("filters", f); }
  else if (k === "proxy") { prefs.proxy = t.value.trim(); save("prefs", prefs); }
  else if (k === "myRate") { prefs.myRate = t.value.replace(",", ".").replace(/[^0-9.]/g, ""); save("prefs", prefs); }
  else if (k === "regAmt") {
    ui.regCalc = t.value.replace(",", ".").replace(/[^0-9.]/g, "");
    var rr = (regs[ui.regTab] || [])[ui.regIdx], ro = $("regOut");
    if (ro && rr) ro.innerHTML = regOutHtml(rr);
  }
  else if (k === "reqAmount") ui.reqAmount = t.value.replace(",", ".").replace(/[^0-9.]/g, "");
  else if (k === "reqRate") ui.reqRate = t.value.replace(",", ".").replace(/[^0-9.]/g, "");
  else if (k === "chatText") ui.chatText = t.value;
  else if (k === "regHandle") ui.regForm.handle = t.value;
  else if (k === "regFrom") ui.regForm.from = t.value;
  else if (k === "regTo") ui.regForm.to = t.value;
  else if (k === "regNote") ui.regForm.note = t.value;
  else if (k.indexOf("calc") === 0) {
    var map = { calcAmount: "amount", calcBuy: "buy", calcSell: "sell", calcFeeBuy: "feeBuy", calcFeeSell: "feeSell" };
    if (map[k]) {
      ui.calc[map[k]] = t.value.replace(",", ".").replace(/[^0-9.]/g, "");
      save("calc", ui.calc);
      var o = $("calcOut"); if (o) o.innerHTML = calcOutHtml();
    }
  }
});
document.addEventListener("change", function (e) {
  var t = e.target, k = t.getAttribute && t.getAttribute("data-f");
  if (!k) return;
  if (k === "token" || k === "fiat") { f[k] = t.value; ui.raw = null; ui.error = null; ui.sp = { loading: false, error: null, data: null }; save("filters", f); render(); }
  else if (k === "third") { f.third = t.checked; save("filters", f); render(); }
  else if (k === "amount" || k === "minRate" || k === "minOrders" || k === "myRate") { render(); }
});
document.addEventListener("keydown", function (e) {
  var t = e.target, k = t.getAttribute && t.getAttribute("data-f");
  if (e.key === "Enter" && (k === "in-words" || k === "in-stop")) { e.preventDefault(); addWord(k === "in-words" ? "words" : "stop"); }
});

if (tg) {
  try { tg.ready(); tg.expand(); tg.onEvent("themeChanged", function () { applyTheme(); }); } catch (e) {}
}
applyTheme();
render();
loadRates().then(function (changed) { if (changed) render(); });
if (marketConfigured()) { marketInit().then(function(){ loadRequests(); }).catch(function(){ toast("Не удалось подключить заявки"); }); setInterval(function(){ if (ui.tab === "requests" && market.ready) loadRequests(); if (market.active && market.ready) loadMessages(market.active.id).then(showChatSheet); }, 8000); }
})();
