<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Strait Pay — Demo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#09111f;--card:#121f33;--line:#263650;--txt:#eef4ff;--muted:#91a4c3;--blue:#2697ff;--green:#24c78a;--orange:#ffb454}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px -apple-system,BlinkMacSystemFont,Arial,sans-serif;padding:env(safe-area-inset-top) 14px calc(86px + env(safe-area-inset-bottom))}
header{padding:22px 4px 16px;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0}small,.muted{color:var(--muted)}.badge{font-size:11px;color:#b8dfff;background:#102d4b;padding:6px 9px;border-radius:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin:11px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#0d192a;border-top:1px solid var(--line);display:flex;padding:9px 5px calc(9px + env(safe-area-inset-bottom));z-index:4}.tabs button{flex:1;background:none;border:0;color:var(--muted);font-size:12px;padding:8px 2px}.tabs button.active{color:#65b8ff}.btn{border:0;border-radius:12px;padding:12px 14px;background:#203550;color:var(--txt);font-weight:650}.primary{background:var(--blue);color:white}.green{background:#126b50}.danger{background:#6d2b34}.btn:disabled{opacity:.45}input,textarea{width:100%;background:#0b1728;color:var(--txt);border:1px solid var(--line);border-radius:11px;padding:13px;margin:6px 0 12px;font:inherit}label{font-size:13px;color:var(--muted)}.price{font-size:24px;font-weight:750;margin:12px 0 4px}.pill{font-size:11px;padding:5px 8px;border-radius:20px;background:#203550}.pill.open{color:#79c5ff}.pill.active{color:var(--orange)}.pill.completed{color:var(--green)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions .btn{flex:1}.hidden{display:none}.notice{background:#1a2b40;border-radius:12px;padding:12px;color:#b9cbe4;font-size:12px;line-height:1.45}.msg{padding:9px 11px;background:#1b2c43;border-radius:12px;margin:7px 0}.empty{text-align:center;color:var(--muted);padding:28px 8px}
</style>
</head>
<body>
<header><div><h1>Strait Pay</h1><small>Демонстрационная доска заявок</small></div><span class="badge">DEMO</span></header>
<div class="notice">Тестовый режим: используйте только вымышленные суммы и данные. Здесь нет подключения к Bybit, платежам или переводам криптовалюты.</div>
<main id="app"></main>
<nav class="tabs">
<button data-tab="feed" class="active">Заявки</button><button data-tab="create">＋ Создать</button><button data-tab="work">В работе</button><button data-tab="archive">Архив</button><button data-tab="profile">Профиль</button>
</nav>
<script>
const SUPABASE_URL="https://pbdsxtidzgnfeoklwnjg.supabase.co";
const SUPABASE_KEY="sb_publishable_TvenpPa82DBJISTZ5BG7kA_HNDjolf2";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
let me=null, name="Участник", tab="feed", tasks=[], chatTask=null, poll=null, workOn=true;
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>Number(n).toLocaleString("ru-RU",{maximumFractionDigits:2});
function toast(t){if(tg?.showAlert)tg.showAlert(t);else alert(t)}
async function init(){
 try{
  if(SUPABASE_KEY.includes("ВСТАВЬТЕ")){app.innerHTML='<div class="card">Вставьте Publishable key в начало HTML в переменную SUPABASE_KEY.</div>';return}
  let s=await client.auth.getSession(); if(!s.data.session){let a=await client.auth.signInAnonymously();if(a.error)throw a.error;s=await client.auth.getSession()}
  me=s.data.session.user; name=(tg?.initDataUnsafe?.user?.first_name||"Участник").slice(0,50);
  let p=await client.from("demo_profiles").select("*").eq("user_id",me.id).maybeSingle();
  if(p.error)throw p.error;
  if(!p.data){let x=await client.from("demo_profiles").insert({user_id:me.id,display_name:name,work_enabled:true});if(x.error)throw x.error}
  else {name=p.data.display_name||name;workOn=!!p.data.work_enabled}
  await refresh(); render();
  poll=setInterval(async()=>{if(!chatTask){await refresh();render()}},10000);
 }catch(e){app.innerHTML='<div class="card">Не удалось подключиться: '+esc(e.message)+'<p class="muted">Проверьте SQL, ключ и Anonymous Sign-ins.</p></div>'}
}
async function refresh(){let r=await client.from("demo_tasks").select("*").order("created_at",{ascending:false}).limit(100);if(r.error)throw r.error;tasks=r.data||[]}
function status(t){return t.status==="active"?"В работе":t.status==="completed"?"Завершена":"Новая"}
function taskCard(t){
 let mine=t.creator_id===me.id, claimed=t.claimed_by===me.id;
 return `<section class="card"><div class="row"><b>Тестовая заявка #${esc(t.id.slice(0,8))}</b><span class="pill ${esc(t.status)}">${status(t)}</span></div><div class="price">${money(t.amount)} <small>условных единиц</small></div><div class="muted">Условный коэффициент: ${money(t.rate)} · Автор: ${esc(t.creator_name)}</div>${t.description?`<p>${esc(t.description)}</p>`:""}<div class="actions">${t.status==="new"&&!mine?`<button class="btn primary" onclick="claim('${t.id}')">Взять в работу</button>`:""}${(mine||claimed)&&t.status!=="completed"?`<button class="btn" onclick="openChat('${t.id}')">Чат</button><button class="btn green" onclick="finish('${t.id}')">Завершить</button>`:""}${mine&&t.status==="new"?`<button class="btn danger" onclick="cancelTask('${t.id}')">Отменить</button>`:""}</div></section>`
}
function render(){
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
 if(tab==="create"){app.innerHTML=`<section class="card"><h3>Новая тестовая заявка</h3><label>Сумма (условные единицы)</label><input id="amount" type="number" min="1" placeholder="Например, 500"><label>Коэффициент (условный)</label><input id="rate" type="number" min="0.01" step="0.01" placeholder="Например, 1.05"><label>Комментарий</label><textarea id="desc" rows="3" placeholder="Тестовое описание"></textarea><button class="btn primary" style="width:100%" onclick="createTask()">Опубликовать заявку</button></section>`;return}
 if(tab==="profile"){app.innerHTML=`<section class="card"><h3>Профиль</h3><p>${esc(name)}</p><p class="muted">ID тестового пользователя: ${esc(me?.id||"")}</p><div class="row"><span>Принимать тестовые заявки</span><input style="width:24px;margin:0" type="checkbox" ${workOn?"checked":""} onchange="setWork(this.checked)"></div></section>`;return}
 let list=tasks.filter(t=>tab==="feed"?t.status==="new"&&t.creator_id!==me.id:tab==="work"?t.status==="active"&&(t.creator_id===me.id||t.claimed_by===me.id):t.status==="completed"&&(t.creator_id===me.id||t.claimed_by===me.id));
 app.innerHTML=list.length?list.map(taskCard).join(""):'<div class="empty">Пока здесь нет заявок</div>';
}
async function createTask(){
 let amount=Number(document.getElementById("amount").value),rate=Number(document.getElementById("rate").value),description=document.getElementById("desc").value.trim();
 if(!(amount>0&&rate>0))return toast("Укажите корректную сумму и коэффициент");
 let r=await client.from("demo_tasks").insert({creator_id:me.id,creator_name:name,amount,rate,description,status:"new"});if(r.error)return toast(r.error.message);
 tab="feed";await refresh();render();toast("Тестовая заявка опубликована");
}
async function claim(id){let r=await client.rpc("claim_demo_task",{task_uuid:id,claimer_name:name});if(r.error)return toast(r.error.message);await refresh();tab="work";render()}
async function finish(id){if(!confirm("Отметить тестовую заявку завершённой?"))return;let r=await client.rpc("finish_demo_task",{task_uuid:id});if(r.error)return toast(r.error.message);await refresh();render()}
async function cancelTask(id){let r=await client.from("demo_tasks").delete().eq("id",id).eq("creator_id",me.id).eq("status","new");if(r.error)return toast(r.error.message);await refresh();render()}
async function setWork(v){workOn=v;let r=await client.from("demo_profiles").update({work_enabled:v}).eq("user_id",me.id);if(r.error)toast(r.error.message);else toast(v?"Приём включён":"Приём выключен")}
async function openChat(id){
 chatTask=tasks.find(t=>t.id===id);if(!chatTask)return;
 let m=await client.from("demo_messages").select("*").eq("task_id",id).order("created_at");if(m.error)return toast(m.error.message);
 let body=m.data.map(x=>`<div class="msg"><b>${esc(x.sender_name)}</b><div>${esc(x.message)}</div><small>${new Date(x.created_at).toLocaleString("ru-RU")}</small></div>`).join("")||'<p class="muted">Сообщений пока нет</p>';
 app.innerHTML=`<section class="card"><button class="btn" onclick="chatTask=null;render()">← Назад</button><h3>Тестовый чат</h3><div>${body}</div><textarea id="msg" placeholder="Сообщение"></textarea><button class="btn primary" onclick="sendMsg()">Отправить</button></section>`;
}
async function sendMsg(){let message=document.getElementById("msg").value.trim();if(!message)return;let r=await client.from("demo_messages").insert({task_id:chatTask.id,sender_id:me.id,sender_name:name,message});if(r.error)return toast(r.error.message);await openChat(chatTask.id)}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",async()=>{tab=b.dataset.tab;chatTask=null;await refresh();render()}));
init();
</script>
</body></html>
